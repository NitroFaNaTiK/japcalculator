version: 2.1

jobs:
  build-test:
    docker:
      - image: circleci/node:14

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package.json" }}
            - v1-dependencies-

      - run:
          name: Installation des dépendances
          command: npm install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

      - run:
          name: Tests
          command: npm run test -- --watchAll=false

      - run:
          name: Build
          command: npm run build

      - run:
          name: Vérification des vulnérabilités
          command: npm audit || true

workflows:
  node-tests:
    jobs:
      - build-test